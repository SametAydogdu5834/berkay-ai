<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berkay AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #212121;
    --sidebar: #171717;
    --composer: #303030;
    --text: #ececec;
    --text-muted: #afafaf;
    --border: #3a3a3a;
    --accent: #10a37f;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 260px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    margin-bottom: 16px;
  }

  .logo {
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .logo span {
    color: var(--accent);
  }

  .new-chat-btn {
    width: 100%;
    padding: 12px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s;
    margin-bottom: 16px;
  }

  .new-chat-btn:hover {
    background: rgba(255,255,255,0.05);
  }

  .sidebar-history {
    flex: 1;
    overflow-y: auto;
    font-size: 0.85rem;
    color: var(--text-muted);
    padding: 8px;
  }

  .sidebar-history p {
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-history p:hover {
    background: rgba(255,255,255,0.05);
  }

  .sidebar-footer {
    padding: 12px;
    font-size: 0.75rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  /* ===== MAIN ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    min-width: 0;
  }

  .top-bar {
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .top-bar-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
  }

  .mobile-menu {
    display: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 1.4rem;
    cursor: pointer;
    padding: 4px 8px;
  }

  /* ===== CHAT AREA ===== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 10px;
  }

  /* Karşılama ekranı — ChatGPT tarzı */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    padding: 40px 20px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .welcome h1 {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 0%, #10a37f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .welcome p {
    color: var(--text-muted);
    font-size: 0.95rem;
    max-width: 400px;
    line-height: 1.6;
  }

  /* Mesajlar */
  .message {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 0;
    display: flex;
    gap: 16px;
    animation: msgIn 0.35s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  .msg-avatar.user {
    background: var(--accent);
    color: #fff;
  }

  .msg-avatar.ai {
    background: linear-gradient(135deg, #10a37f, #0d8a6a);
    color: #fff;
  }

  .msg-content {
    flex: 1;
    line-height: 1.7;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    padding-top: 4px;
  }

  .msg-content.user {
    color: var(--text);
  }

  .msg-content.ai {
    color: var(--text);
  }

  .msg-content.loading::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 16px;
    background: var(--accent);
    margin-left: 4px;
    animation: blink 1s infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* ===== COMPOSER ===== */
  .composer-wrapper {
    padding: 16px 20px 24px;
    background: linear-gradient(transparent, var(--bg) 30%);
    position: sticky;
    bottom: 0;
  }

  .composer {
    max-width: 720px;
    margin: 0 auto;
    background: var(--composer);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 12px 16px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .composer:focus-within {
    border-color: #555;
    box-shadow: 0 0 0 1px #555;
  }

  .composer textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
    resize: none;
    max-height: 200px;
    line-height: 1.6;
    padding: 4px 0;
  }

  .composer textarea::placeholder {
    color: #666;
  }

  .composer-actions {
    display: flex;
    gap: 6px;
  }

  .send-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s, transform 0.15s;
    flex-shrink: 0;
  }

  .send-btn:hover:not(:disabled) {
    opacity: 0.85;
    transform: scale(1.05);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .disclaimer {
    max-width: 720px;
    margin: 10px auto 0;
    text-align: center;
    font-size: 0.72rem;
    color: #666;
  }

  /* ===== MOBİL ===== */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      z-index: 100;
      transform: translateX(-100%);
    }
    .sidebar.open {
      transform: translateX(0);
    }
    .mobile-menu {
      display: block;
    }
    .welcome h1 { font-size: 1.5rem; }
    .message { padding: 16px 0; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">Berkay<span> AI</span></div>
  </div>
  <button class="new-chat-btn" id="newChatBtn">
    <span>＋</span> Yeni Sohbet
  </button>
  <div class="sidebar-history" id="historyList">
    <p>📌 Hoş geldin, Berkay!</p>
  </div>
  <div class="sidebar-footer">
    Berkay AI · Groq destekli
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="top-bar">
    <button class="mobile-menu" id="mobileMenu">☰</button>
    <div class="top-bar-title">Berkay AI</div>
    <div></div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h1>Merhaba, Berkay! 👋</h1>
      <p>Ben Berkay AI. Sorularını sor, fikirlerini paylaş, sana yardımcı olayım.</p>
    </div>
  </div>

  <div class="composer-wrapper">
    <div class="composer">
      <textarea id="userInput" rows="1" placeholder="Berkay AI'ye mesaj yaz..."></textarea>
      <div class="composer-actions">
        <button class="send-btn" id="sendBtn" disabled>➤</button>
      </div>
    </div>
    <div class="disclaimer">Berkay AI hata yapabilir. Önemli bilgileri doğrulayın.</div>
  </div>
</div>

<script>
// ==========================================
// BERKAY AI — ChatGPT Tarzı Arayüz
// API: Vercel Serverless Proxy (/api/chat)
// Anahtar tarayıcıya ASLA gönderilmez
// ==========================================

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');
const newChatBtn = document.getElementById('newChatBtn');
const mobileMenu = document.getElementById('mobileMenu');
const sidebar = document.getElementById('sidebar');

// Konuşma geçmişi (sadece tarayıcı belleğinde)
let conversationHistory = [
  { role: 'system', content: 'Sen Berkay AI adında, Türkçe konuşan, samimi, yardımsever ve zeki bir yapay zeka asistanısın. Kullanıcıya kısa, net ve dostane cevaplar ver.' }
];

// Textarea otomatik büyüme
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
  sendBtn.disabled = userInput.value.trim() === '';
});

// Enter ile gönder (Shift+Enter yeni satır)
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

sendBtn.addEventListener('click', handleSend);

// Yeni sohbet
newChatBtn.addEventListener('click', () => {
  conversationHistory = [
    { role: 'system', content: 'Sen Berkay AI adında, Türkçe konuşan, samimi, yardımsever ve zeki bir yapay zeka asistanısın. Kullanıcıya kısa, net ve dostane cevaplar ver.' }
  ];
  chatArea.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Merhaba, Berkay! 👋</h1>
      <p>Ben Berkay AI. Sorularını sor, fikirlerini paylaş, sana yardımcı olayım.</p>
    </div>
  `;
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  if (window.innerWidth <= 768) sidebar.classList.remove('open');
});

// Mobil menü
mobileMenu.addEventListener('click', () => {
  sidebar.classList.toggle('open');
});

// Mesaj ekle
function addMessage(role, text) {
  if (welcome) { welcome.remove(); welcome = null; }

  const div = document.createElement('div');
  div.className = 'message';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar ' + role;
  avatar.textContent = role === 'user' ? 'B' : '🤖';

  const content = document.createElement('div');
  content.className = 'msg-content ' + role;
  content.textContent = text;

  div.appendChild(avatar);
  div.appendChild(content);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return content;
}

// Yükleniyor animasyonu
function addLoading() {
  if (welcome) { welcome.remove(); welcome = null; }

  const div = document.createElement('div');
  div.className = 'message';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar ai';
  avatar.textContent = '🤖';

  const content = document.createElement('div');
  content.className = 'msg-content ai loading';
  content.textContent = 'Düşünüyorum';

  div.appendChild(avatar);
  div.appendChild(content);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return content;
}

// Gönder
async function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;

  const loadingEl = addLoading();

  try {
    // Vercel sunucu proxy'sine istek — anahtar burada görünmez
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Sunucu hatası (' + response.status + ')');
    }

    const aiReply = data.content;
    conversationHistory.push({ role: 'assistant', content: aiReply });

    loadingEl.classList.remove('loading');
    loadingEl.textContent = aiReply;
    chatArea.scrollTop = chatArea.scrollHeight;

  } catch (err) {
    loadingEl.classList.remove('loading');
    loadingEl.textContent = '❌ Hata: ' + err.message;
    console.error(err);
  } finally {
    sendBtn.disabled = userInput.value.trim() === '';
  }
}
</script>

</body>
</html>
